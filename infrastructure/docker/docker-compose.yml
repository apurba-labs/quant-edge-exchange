version: "3.8"

services:

  dsql-local:
    image: postgres:16-alpine
    container_name: quant_dsql_local
    environment:
      POSTGRES_USER: platform_builder
      POSTGRES_PASSWORD: local_secret_password
      POSTGRES_DB: quant_edge_ledger
    ports:
      - "5432:5432"

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: quant_dynamodb_local
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    container_name: quant_redis_local
    ports:
      - "6379:6379"